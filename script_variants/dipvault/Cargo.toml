[package]
name = "dipvault-script"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dipvault_script"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = "=1.2.0"
bordrless-launch = { git = "https://github.com/BordrlessDex/bordrless-programs",
                     features = ["no-entrypoint"] }
bordrless-token = { git = "https://github.com/BordrlessDex/bordrless-programs",
                    features = ["no-entrypoint"] }

[workspace]
members = ["."]
